name: TurboFlow Public BTC Economics Probe
on:
  push:
    branches: [main]
    paths:
      - "turboflow_public_probe.py"
      - ".github/workflows/turboflow_public_probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python -u turboflow_public_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turboflow-public-probe
          path: turboflow_public_probe.json
          if-no-files-found: warn
