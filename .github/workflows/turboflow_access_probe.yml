name: TurboFlow Access Rules Probe
on:
  push:
    branches: [main]
    paths: ["turboflow_access_probe.py",".github/workflows/turboflow_access_probe.yml"]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: python -u turboflow_access_probe.py
