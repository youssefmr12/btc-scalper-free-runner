name: MFLIP V6.2 Full-L2 1h
on:
  push:
    branches: [mflip-v62-full-l2-1h-20261112]
    paths:
      - 'research/mflip_v62_1h/**'
      - '.github/workflows/mflip_v62_1h.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q requests numpy pandas pyarrow sortedcontainers scikit-learn
      - name: Fetch SHA-verified Tardis Full-L2
        run: |
          set -euo pipefail
          cd research/mflip_v62_1h
          mkdir -p v62data
          curl -fL --retry 5 --retry-delay 2 \
            'https://datasets.tardis.dev/v1/binance-futures/incremental_book_L2/2025/12/01/BTCUSDT.csv.gz' \
            -o v62data/book.csv.gz
          echo '53efda11b664eb0a3ea706e267dc185f51a9d1ef760e328181746185be656043  v62data/book.csv.gz' | sha256sum -c -
          ls -lh v62data/book.csv.gz
      - name: Run frozen one-hour Full-L2 walk-forward
        run: |
          set -euo pipefail
          cd research/mflip_v62_1h
          python run_v62_1h.py | tee run.log
      - name: Print result
        if: always()
        run: |
          cd research/mflip_v62_1h
          if [ -f v62out/result.json ]; then cat v62out/result.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mflip-v62-full-l2-1h-result
          path: |
            research/mflip_v62_1h/v62out/
            research/mflip_v62_1h/run.log
          if-no-files-found: warn
          retention-days: 7
