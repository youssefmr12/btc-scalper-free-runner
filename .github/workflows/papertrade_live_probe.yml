name: Papertrade Live Economics Probe
on:
  push:
    branches: [main]
    paths: ["papertrade_live_probe.py",".github/workflows/papertrade_live_probe.yml"]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: python -u papertrade_live_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papertrade-live-probe
          path: papertrade_live_probe.json
          if-no-files-found: warn
