name: BTC Scalper Free Replay

on:
  push:
    branches: [main]
    paths:
      - "request.json"
      - ".github/workflows/replay.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Load request
        id: req
        shell: bash
        run: |
          DATE=$(jq -r '.date' request.json)
          EQUITY=$(jq -r '.start_equity' request.json)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "equity=$EQUITY" >> "$GITHUB_OUTPUT"
          echo "DATE=$DATE START_EQUITY=$EQUITY"

      - name: Checkout private strategy sources
        uses: actions/checkout@v4
        with:
          repository: youssefmr12/forma-body-os
          ref: btc-scalper-v190-actions
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install PyYAML

      - name: Compile recovered strategy
        run: |
          cd private/btc_scalper_v190/recovered_sources
          python -m py_compile signal_engine.py risk_manager.py capital_risk_engine.py execution_shield.py edge_quality_v185.py edge_quality_v187.py confirmed_move_compounder_v190.py replay_reconstructed_v190.py

      - name: Run streaming causal A-B replay
        run: |
          python -u private/btc_scalper_v190/recovered_sources/replay_reconstructed_v190.py \
            --date "${{ steps.req.outputs.date }}" \
            --out ab_result.json \
            --data-dir data_raw \
            --fidelity-only
          cat ab_result.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v190-ab-result
          path: ab_result.json
          if-no-files-found: warn
