name: BTC Scalper Free Replay

on:
  push:
    branches: [main]
    paths:
      - "request.json"
      - ".github/workflows/replay.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Load request
        id: req
        shell: bash
        run: |
          DATE=$(jq -r '.date' request.json)
          EQUITY=$(jq -r '.start_equity' request.json)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "equity=$EQUITY" >> "$GITHUB_OUTPUT"

      - name: Checkout private benchmark package
        uses: actions/checkout@v4
        with:
          repository: youssefmr12/forma-body-os
          ref: btc-scalper-v190-actions
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "lighter-data" pyarrow PyYAML

      - name: Repair and prepare benchmark package
        shell: bash
        run: |
          set -e
          mkdir -p v190
          SRC="private/btc_scalper_v190/v190_ab_package.zip"
          if unzip -t "$SRC" >/tmp/ziptest.log 2>&1; then
            unzip -q "$SRC" -d v190
          else
            cat /tmp/ziptest.log || true
            yes | zip -FF "$SRC" --out /tmp/v190_repaired.zip >/tmp/zipfix.log 2>&1 || true
            cat /tmp/zipfix.log || true
            unzip -t /tmp/v190_repaired.zip
            unzip -q /tmp/v190_repaired.zip -d v190
          fi
          find v190 -maxdepth 2 -type f -print
          python -m py_compile v190/*.py

      - name: Download historical BTC data
        run: |
          lighter-data tardis --coins BTC --dates "${{ steps.req.outputs.date }}" --root data
          find data -type f -name '*.parquet' -print | head -20

      - name: Run deterministic A-B replay
        run: |
          python v190/replay_compare_v190.py \
            --config v190/config.yaml \
            --data-root data \
            --date "${{ steps.req.outputs.date }}" \
            --start-equity "${{ steps.req.outputs.equity }}" \
            --out ab_result.json
          cat ab_result.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v190-ab-result
          path: ab_result.json
          if-no-files-found: warn
