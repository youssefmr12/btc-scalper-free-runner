name: BTC Scalper Free Replay

on:
  push:
    branches: [main]
    paths:
      - "request.json"
      - ".github/workflows/replay.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Load request
        id: req
        shell: bash
        run: |
          DATE=$(jq -r '.date' request.json)
          EQUITY=$(jq -r '.start_equity' request.json)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "equity=$EQUITY" >> "$GITHUB_OUTPUT"
          echo "Replay date: $DATE"
          echo "Starting equity: $EQUITY"

      - name: Checkout private strategy package
        uses: actions/checkout@v4
        with:
          repository: youssefmr12/forma-body-os
          ref: btc-scalper-v190-actions
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "lighter-data" pyarrow PyYAML

      - name: Prepare V1.8.7 and V1.9
        run: |
          mkdir -p v190
          unzip -q private/btc_scalper_v190/v190_ab_package.zip -d v190
          python -m py_compile v190/*.py

      - name: Download Lighter BTC L2 and trades
        run: |
          lighter-data tardis --coins BTC --dates "${{ steps.req.outputs.date }}" --root data
          echo "Downloaded parquet files:"
          find data -type f -name '*.parquet' | wc -l

      - name: Run deterministic causal A-B replay
        run: |
          python v190/replay_compare_v190.py \
            --config v190/config.yaml \
            --data-root data \
            --date "${{ steps.req.outputs.date }}" \
            --start-equity "${{ steps.req.outputs.equity }}" \
            --out ab_result.json
          python - <<'PY'
          import json
          with open("ab_result.json") as f:
              d=json.load(f)
          print(json.dumps(d, indent=2))
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v190-ab-result
          path: ab_result.json
          if-no-files-found: warn
