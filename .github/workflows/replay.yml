name: BTC Scalper Free Replay

on:
  push:
    branches: [main]
    paths:
      - "request.json"
      - ".github/workflows/replay.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Load request
        id: req
        shell: bash
        run: |
          DATE=$(jq -r '.date' request.json)
          EQUITY=$(jq -r '.start_equity' request.json)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "equity=$EQUITY" >> "$GITHUB_OUTPUT"
          echo "Historical replay date: $DATE"
          echo "Starting equity: $EQUITY"

      - name: Checkout private replay package
        uses: actions/checkout@v4
        with:
          repository: youssefmr12/forma-body-os
          ref: btc-scalper-v190-actions
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Prepare recovered replay
        run: |
          rm -rf recovered
          mkdir -p recovered
          unzip -q private/btc_scalper_v190/recovered_v190_replay.zip -d recovered
          python -m py_compile recovered/*.py

      - name: Run historical deterministic replay
        run: |
          python recovered/run_v190_ab.py \
            --date "${{ steps.req.outputs.date }}" \
            --start-equity "${{ steps.req.outputs.equity }}" \
            --out ab_result.json
          echo "=== RESULT_JSON_BEGIN ==="
          cat ab_result.json
          echo "=== RESULT_JSON_END ==="

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v190-ab-result
          path: ab_result.json
          if-no-files-found: warn
