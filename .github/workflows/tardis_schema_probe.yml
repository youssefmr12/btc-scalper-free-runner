name: Tardis Bybit Schema Probe
on:
  push:
    branches: [main]
    paths: ['tardis_schema_probe.py','.github/workflows/tardis_schema_probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: python tardis_schema_probe.py
