name: TurboFlow Official Docs and App Probe
on:
  push:
    branches: [main]
    paths:
      - "turboflow_official_probe.py"
      - ".github/workflows/turboflow_official_probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python -u turboflow_official_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turboflow-official-probe
          path: tf_docs/
          if-no-files-found: warn
