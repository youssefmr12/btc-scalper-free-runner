name: RS9 6h replay
on:
  push:
    branches: [rs9-6h-replay-20261110]
    paths:
      - '.github/workflows/rs9_6h_replay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rs9-6h-replay-20261110
      - name: Reconstruct replay bundle
        run: |
          mkdir -p rs9_replay_run
          cat rs9_replay_bundle_nopyc/part*.txt | base64 -d > rs9_replay_run/bundle.zip
          unzip -q rs9_replay_run/bundle.zip -d rs9_replay_run/bundle
          python -m py_compile rs9_replay_run/bundle/replay_6h.py
      - name: Install dependencies
        run: python -m pip install --quiet pyyaml
      - name: Run high-fidelity 6h replay
        env:
          START_EQUITY: "2.30"
        run: |
          set -o pipefail
          cd rs9_replay_run/bundle
          python replay_6h.py 2>&1 | tee ../../replay.log
      - name: Save results to branch
        if: always()
        run: |
          mkdir -p rs9_replay_results/latest
          cp replay.log rs9_replay_results/latest/replay.log || true
          cp rs9_replay_run/bundle/result.json rs9_replay_results/latest/result.json || true
          git config user.name "rs9-replay-bot"
          git config user.email "rs9-replay-bot@users.noreply.github.com"
          git add rs9_replay_results/latest
          git diff --cached --quiet || git commit -m "RS9 6h replay results"
          git push origin HEAD:rs9-6h-replay-20261110
