name: RS9 6h replay verified no-binbook
on:
  push:
    branches: [rs9-6h-replay-20261110]
    paths:
      - '.github/workflows/rs9_6h_replay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rs9-6h-replay-20261110
      - name: Reconstruct verified replay bundle
        run: |
          mkdir -p rs9_replay_run
          cat \
            rs9_replay_bundle_small/chunk00.txt \
            rs9_replay_bundle_small/c01_0.txt \
            rs9_replay_bundle_small/c01_1_0.txt \
            rs9_replay_bundle_small/c01_1_1.txt \
            rs9_replay_bundle_small/c01_2.txt \
            rs9_replay_bundle_small/c01_3.txt \
            rs9_replay_bundle_small/bridgeA.txt \
            rs9_replay_bundle_nopyc/part01.txt \
            rs9_replay_bundle_nopyc/part02.txt \
            rs9_replay_bundle_small/bridgeB.txt \
            rs9_replay_bundle_small/chunk08.txt \
            rs9_replay_bundle_small/chunk09.txt \
            | base64 -d > rs9_replay_run/bundle.zip
          echo "07790a3f972ec64bc5b1822e4ed15ccd6d4ffab3089cc1a4ab5532360fd53a1d  rs9_replay_run/bundle.zip" | sha256sum -c -
          unzip -q rs9_replay_run/bundle.zip -d rs9_replay_run/bundle
          python - <<'PY'
from pathlib import Path
p=Path("rs9_replay_run/bundle/replay_6h.py")
s=p.read_text()
s=s.replace(" 'bin_book':'https://data.binance.vision/data/futures/um/daily/bookTicker/BTCUSDT/BTCUSDT-bookTicker-2026-11-09.zip',\n","")
old="    bin_ok=True\n    try:its += [zip_csv_iter(paths['bin_agg'],'binagg'),zip_csv_iter(paths['bin_book'],'binbook')]\n    except Exception:bin_ok=False\n"
new="    bin_ok=True\n    try:its.append(zip_csv_iter(paths['bin_agg'],'binagg'))\n    except Exception:bin_ok=False\n"
if old not in s:
    raise SystemExit("expected replay block not found")
s=s.replace(old,new)
p.write_text(s)
PY
          python -m py_compile rs9_replay_run/bundle/replay_6h.py
      - name: Install dependencies
        run: python -m pip install --quiet pyyaml
      - name: Run high-fidelity 6h replay
        env:
          START_EQUITY: "2.30"
        run: |
          set -o pipefail
          cd rs9_replay_run/bundle
          python replay_6h.py 2>&1 | tee ../../replay.log
      - name: Save results to branch
        if: always()
        run: |
          mkdir -p rs9_replay_results/latest
          cp replay.log rs9_replay_results/latest/replay.log || true
          cp rs9_replay_run/bundle/result.json rs9_replay_results/latest/result.json || true
          git config user.name "rs9-replay-bot"
          git config user.email "rs9-replay-bot@users.noreply.github.com"
          git add rs9_replay_results/latest
          git diff --cached --quiet || git commit -m "RS9 6h replay results"
          git push origin HEAD:rs9-6h-replay-20261110
